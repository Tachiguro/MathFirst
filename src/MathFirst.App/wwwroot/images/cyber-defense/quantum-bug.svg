<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none" aria-hidden="true">
  <defs>
    <radialGradient id="qb-carapace-grad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#243f33" />
      <stop offset="50%" stop-color="#12241d" />
      <stop offset="100%" stop-color="#06100c" />
    </radialGradient>
    <linearGradient id="qb-neon-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72ffc2" />
      <stop offset="50%" stop-color="#3effa8" />
      <stop offset="100%" stop-color="#00e5a3" />
    </linearGradient>
    <linearGradient id="qb-hex-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#00ffff" />
      <stop offset="80%" stop-color="#1be3a9" />
      <stop offset="100%" stop-color="#0a2a1d" />
    </linearGradient>
    <radialGradient id="qb-floor-glow" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#3effa8" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#1be3a9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06100c" stop-opacity="0" />
    </radialGradient>
    <filter id="qb-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient floor reflection -->
  <ellipse cx="100" cy="182" rx="44" ry="9" fill="url(#qb-floor-glow)" />

  <!-- Quantum Circuit Cyber Legs (3 pairs) -->
  <g stroke="#2cda9d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- Top Legs -->
    <polyline points="74,86 42,70 24,84" />
    <polyline points="126,86 158,70 176,84" />
    <!-- Mid Legs -->
    <polyline points="70,110 34,112 18,134" />
    <polyline points="130,110 166,112 182,134" />
    <!-- Bottom Legs -->
    <polyline points="74,134 44,152 30,174" />
    <polyline points="126,134 156,152 170,174" />
    <!-- Leg Joint Light Nodes -->
    <circle cx="42" cy="70" r="2.5" fill="#00ffff" filter="url(#qb-glow)" />
    <circle cx="158" cy="70" r="2.5" fill="#00ffff" filter="url(#qb-glow)" />
    <circle cx="34" cy="112" r="2.5" fill="#3effa8" filter="url(#qb-glow)" />
    <circle cx="166" cy="112" r="2.5" fill="#3effa8" filter="url(#qb-glow)" />
    <circle cx="44" cy="152" r="2.5" fill="#00ffff" filter="url(#qb-glow)" />
    <circle cx="156" cy="152" r="2.5" fill="#00ffff" filter="url(#qb-glow)" />
  </g>

  <!-- Antennae / Quantum Probe Wires -->
  <g stroke="#3effa8" stroke-width="1.8" stroke-linecap="round" filter="url(#qb-glow)">
    <path d="M88 56 Q76 34 58 24" />
    <path d="M112 56 Q124 34 142 24" />
    <circle cx="58" cy="24" r="3" fill="#ffffff" />
    <circle cx="142" cy="24" r="3" fill="#ffffff" />
  </g>

  <!-- Rear Abdomen Shell -->
  <polygon points="100,166 68,142 66,108 100,98 134,108 132,142" fill="url(#qb-carapace-grad)" stroke="url(#qb-neon-edge)" stroke-width="1.8" stroke-linejoin="round" />
  <!-- Circuit Traces on Abdomen -->
  <line x1="100" y1="110" x2="100" y2="156" stroke="#1be3a9" stroke-width="1.5" />
  <line x1="82" y1="126" x2="100" y2="136" stroke="#00ffff" stroke-width="1.2" />
  <line x1="118" y1="126" x2="100" y2="136" stroke="#00ffff" stroke-width="1.2" />

  <!-- Thorax / Head Plate -->
  <polygon points="100,52 124,70 120,96 100,102 80,96 76,70" fill="url(#qb-carapace-grad)" stroke="#3effa8" stroke-width="2" stroke-linejoin="round" />

  <!-- Hexagonal Quantum Processor Core -->
  <polygon points="100,114 112,121 112,135 100,142 88,135 88,121" fill="url(#qb-hex-core)" stroke="#ffffff" stroke-width="1.5" filter="url(#qb-glow)" />

  <!-- Multi-Sensor Eye Cluster -->
  <g filter="url(#qb-glow)">
    <circle cx="92" cy="68" r="3.5" fill="#00ffff" />
    <circle cx="108" cy="68" r="3.5" fill="#00ffff" />
    <circle cx="100" cy="60" r="2.5" fill="#ffffff" />
    <circle cx="100" cy="76" r="2.5" fill="#3effa8" />
  </g>

  <!-- Mandibles -->
  <polygon points="86,88 80,104 90,96" fill="#12241d" stroke="#00ffff" stroke-width="1.2" />
  <polygon points="114,88 120,104 110,96" fill="#12241d" stroke="#00ffff" stroke-width="1.2" />
</svg>
