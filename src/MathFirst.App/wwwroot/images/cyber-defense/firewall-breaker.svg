<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none" aria-hidden="true">
  <defs>
    <radialGradient id="fb-plate-grad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2a3d34" />
      <stop offset="50%" stop-color="#15241e" />
      <stop offset="100%" stop-color="#09120e" />
    </radialGradient>
    <linearGradient id="fb-edge-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3effa8" />
      <stop offset="50%" stop-color="#1be3a9" />
      <stop offset="100%" stop-color="#00ffff" />
    </linearGradient>
    <linearGradient id="fb-ram-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#3effa8" />
      <stop offset="70%" stop-color="#1be3a9" />
      <stop offset="100%" stop-color="#0a291e" />
    </linearGradient>
    <radialGradient id="fb-floor-glow" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#1be3a9" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0df2c9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#07120e" stop-opacity="0" />
    </radialGradient>
    <filter id="fb-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient floor reflection -->
  <ellipse cx="100" cy="182" rx="48" ry="10" fill="url(#fb-floor-glow)" />

  <!-- Heavy Outer Battering Shields (Left & Right) -->
  <!-- Left Shield -->
  <polygon points="48,50 14,75 22,142 54,128" fill="url(#fb-plate-grad)" stroke="#2cda9d" stroke-width="2" stroke-linejoin="round" />
  <polygon points="20,78 28,136 48,124 42,68" fill="#101c17" stroke="#3effa8" stroke-width="1.2" />
  <!-- Shield Trench Light -->
  <line x1="26" y1="84" x2="32" y2="130" stroke="#00ffff" stroke-width="2" filter="url(#fb-glow)" />

  <!-- Right Shield -->
  <polygon points="152,50 186,75 178,142 146,128" fill="url(#fb-plate-grad)" stroke="#2cda9d" stroke-width="2" stroke-linejoin="round" />
  <polygon points="180,78 172,136 152,124 158,68" fill="#101c17" stroke="#3effa8" stroke-width="1.2" />
  <!-- Shield Trench Light -->
  <line x1="174" y1="84" x2="168" y2="130" stroke="#00ffff" stroke-width="2" filter="url(#fb-glow)" />

  <!-- Heavy Central Chassis -->
  <polygon points="68,58 132,58 144,116 100,154 56,116" fill="url(#fb-plate-grad)" stroke="url(#fb-edge-glow)" stroke-width="2" stroke-linejoin="round" />
  <!-- Lower Underplate -->
  <polygon points="76,112 124,112 100,146" fill="#0c1712" stroke="#1be3a9" stroke-width="1.5" />

  <!-- Breach Ram Horns / Spikes -->
  <polygon points="62,56 46,26 76,46" fill="url(#fb-ram-grad)" stroke="#ffffff" stroke-width="1.5" filter="url(#fb-glow)" />
  <polygon points="138,56 154,26 124,46" fill="url(#fb-ram-grad)" stroke="#ffffff" stroke-width="1.5" filter="url(#fb-glow)" />

  <!-- Head / Helmet Plate -->
  <polygon points="80,50 120,50 128,84 100,94 72,84" fill="#182922" stroke="#3effa8" stroke-width="2" />

  <!-- Menacing Tactical Visor Slit -->
  <polygon points="82,68 118,68 114,76 86,76" fill="#00ffff" filter="url(#fb-glow)" />
  <line x1="78" y1="72" x2="122" y2="72" stroke="#ffffff" stroke-width="1.5" filter="url(#fb-glow)" />

  <!-- Heavy Pneumatic Piston Rods -->
  <line x1="58" y1="92" x2="72" y2="92" stroke="#3effa8" stroke-width="3" />
  <line x1="142" y1="92" x2="128" y2="92" stroke="#3effa8" stroke-width="3" />
  <circle cx="58" cy="92" r="3" fill="#00ffff" />
  <circle cx="142" cy="92" r="3" fill="#00ffff" />

  <!-- Breaker Core Energy Vent -->
  <polygon points="92,106 108,106 100,122" fill="#3effa8" filter="url(#fb-glow)" />
</svg>
