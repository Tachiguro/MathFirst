<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="drone-body" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2CDA9D" />
      <stop offset="100%" stop-color="#0F523A" />
    </linearGradient>
    <radialGradient id="drone-eye" cx="60" cy="56" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="60%" stop-color="#176B4D" />
      <stop offset="100%" stop-color="#0A2218" />
    </radialGradient>
    <filter id="cyber-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Thruster Flares -->
  <polygon points="26,76 34,70 30,88" fill="#00FFFF" opacity="0.8" />
  <polygon points="94,76 86,70 90,88" fill="#00FFFF" opacity="0.8" />

  <!-- Drone Wings / Chassis -->
  <polygon points="60,22 92,38 106,64 88,72 60,60 32,72 14,64 28,38" fill="url(#drone-body)" stroke="#65C99D" stroke-width="2" stroke-linejoin="round" />

  <!-- Armor plating facets -->
  <polygon points="60,26 84,38 60,54 36,38" fill="#17241F" stroke="#2CDA9D" stroke-width="1.5" />
  <polygon points="28,42 18,62 34,68" fill="#121916" stroke="#2CDA9D" stroke-width="1" />
  <polygon points="92,42 102,62 86,68" fill="#121916" stroke="#2CDA9D" stroke-width="1" />

  <!-- Circuit Linework -->
  <path d="M42 34 L30 24 M78 34 L90 24" stroke="#00FFFF" stroke-width="2" stroke-linecap="round" />
  <circle cx="30" cy="24" r="2.5" fill="#00FFFF" />
  <circle cx="90" cy="24" r="2.5" fill="#00FFFF" />

  <!-- Central Optical Scanner -->
  <circle cx="60" cy="56" r="14" fill="url(#drone-eye)" stroke="#00FFFF" stroke-width="2" filter="url(#cyber-glow)" />
  <circle cx="60" cy="56" r="6" fill="#FFFFFF" />
  <line x1="46" y1="56" x2="74" y2="56" stroke="#00FFFF" stroke-width="1" opacity="0.6" />

  <!-- Glitch Slice Artifacts -->
  <line x1="16" y1="50" x2="38" y2="50" stroke="#00FFFF" stroke-width="2" opacity="0.85" />
  <line x1="82" y1="62" x2="104" y2="62" stroke="#2CDA9D" stroke-width="2" opacity="0.85" />
  <rect x="52" y="76" width="16" height="3" fill="#00FFFF" opacity="0.7" />
</svg>
